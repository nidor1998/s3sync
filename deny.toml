# ============================================================
# cargo-deny configuration
# https://embarkstudios.github.io/cargo-deny/
# ============================================================

# ---- 1. Advisories (RustSec Advisory DB) ----
[advisories]
# All vulnerability/unsound/notice advisories are errors by default.
# To ignore a specific advisory, add it here with a reason:
ignore = [
    # crypto-bigint 0.5.x timing variability; fixed only in >=0.7.6.
    # Pulled in by aws-sigv4 (sigv4a feature), which still requires ^0.5.4
    # as of 1.6.3. Remove once the AWS SDK moves to crypto-bigint 0.7.
    { id = "RUSTSEC-2026-0387", reason = "no compatible fix; aws-sigv4 pins crypto-bigint ^0.5" },
]

# ---- 2. Licenses ----
[licenses]
allow = [
    "Apache-2.0 WITH LLVM-exception",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]

[[licenses.clarify]]
crate = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [
    { path = "LICENSE", hash = 0xbd0eed23 }
]

# ---- 3. Bans ----
[bans]
multiple-versions = "warn"
wildcards = "warn"
deny = [
    { crate = "openssl-sys", reason = "rustls is used; openssl is unnecessary" },
]

# ---- 4. Sources ----
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
